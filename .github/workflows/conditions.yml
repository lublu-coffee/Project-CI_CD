name: Work with conditions
run-name: Condition Work
on: workflow_dispatch
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Need Sleep
        run: sleep 30
      - name: Canceled Sleep
        if: ${{ cancelled() }}
        run: echo We wake up !!!
      - name: Start Always
        if: ${{ always() }}
        run: echo Print Always because Always

  double_first_job:
    needs: first_job
    if: ${{ cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Print OK
        run: echo Double First -> OK_OK_OK

  second_job:
    needs: first_job
    if: ${{ needs.first_job.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sleep TWO
        id: sleep-two-step
        run: sleep 35

      - name: Only cancel
        if: ${{ cancelled() }}
        run: Pre-Step was Cancelled

      - name: Only success
        if: ${{ steps.sleep-two-step.conclusion == 'success' }}
        run: echo Love Sleep

